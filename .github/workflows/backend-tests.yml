name: Backend regression and coverage

on:
  push:
    branches:
      - test/backend-test-suite
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Unit, syntax, and coverage checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and syntax checks
        run: npm test

      - name: Generate full-source coverage report
        run: npm run test:coverage
